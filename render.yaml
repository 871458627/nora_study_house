# Render Blueprint：免费档单服务同源部署（docs/08-免费部署指南.md）
# 用法：Render 控制台 New → Blueprint → 指向本仓库；DATABASE_URL 填 Neon 直连串（sync: false 运行时输入）。
# 数据库迁移不在此编排（Blueprint 规范无一次性任务类型）：本机执行
#   cd server && DATABASE_URL=<Neon直连串> npx prisma migrate deploy
services:
  - type: web
    name: xiaotao-app
    runtime: node
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    buildCommand: cd web && npm ci && npm run build && cd ../server && npm ci --workspaces=false && npx prisma generate && npm run build
    startCommand: cd server && node dist/src/app.js
    envVars:
      - key: WEB_DIST_DIR
        value: ../web/dist
      - key: XTAO_REPO
        value: prisma
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false

